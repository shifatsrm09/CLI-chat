<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
  <title>api.cfat.site</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- SCREEN 1: LOBBY -->
  <main id="lobby-screen" class="screen active">
    <div class="lobby-panel">
      <header class="brand">
        <div class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>api.cfat.site</h1>
        </div>
      </header>

      <nav class="segmented-control" aria-label="Room access mode">
        <button id="tab-join" class="tab-btn active" type="button" onclick="switchTab('join')">Join Room</button>
        <button id="tab-host" class="tab-btn" type="button" onclick="switchTab('host')">Host Room</button>
      </nav>

      <!-- JOIN ROOM FORM -->
      <form id="join-form" class="auth-form" onsubmit="handleJoin(event)">
        <div class="field">
          <label for="join-room">Room Code</label>
          <input type="text" id="join-room" placeholder="4821" required autocomplete="off" spellcheck="false" maxlength="24">
        </div>
        <div class="field">
          <label for="join-user">Your Name</label>
          <input type="text" id="join-user" placeholder="Enter handle" required autocomplete="name" maxlength="24">
        </div>
        <button type="submit" class="primary-btn">
          <span>Enter Room</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- HOST ROOM FORM -->
      <form id="host-form" class="auth-form hidden" onsubmit="handleHost(event)">
        <div class="field">
          <label for="host-room">Room Code</label>
          <div class="field-composite">
            <input type="text" id="host-room" placeholder="4821" required autocomplete="off" spellcheck="false" maxlength="24">
            <button type="button" class="btn-addon" onclick="generateNewRoomCode()" title="Generate new code" aria-label="Generate new code">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="host-user">Your Name</label>
          <input type="text" id="host-user" placeholder="Enter handle" required autocomplete="name" maxlength="24">
        </div>
        <button type="submit" class="primary-btn">
          <span>Create & Connect</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <footer class="lobby-meta">
        <span>Persistent room memory · Cloudflare Durable Objects</span>
      </footer>
    </div>
  </main>

  <!-- SCREEN 2: ACTIVE CHAT -->
  <main id="chat-screen" class="screen">
    <!-- Top Action Bar -->
    <header class="chat-header">
      <div class="header-cluster left">
        <button class="nav-btn" onclick="leaveRoom()" title="Leave room" aria-label="Leave room">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="room-descriptor">
          <div class="room-identifier">
            <span class="muted-prefix">Room</span>
            <span id="active-room-code" class="room-code-badge">XXXX</span>
            <button class="btn-text-action" onclick="copyInviteLink()" title="Copy invite link">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>Share</span>
            </button>
          </div>
          <div class="telemetry-row">
            <span id="status-dot" class="status-indicator live"></span>
            <span id="status-text">Connected</span>
          </div>
        </div>
      </div>

      <div class="header-cluster right">
        <button class="nav-btn" id="sound-btn" onclick="toggleSound()" title="Toggle notification audio" aria-label="Toggle notification audio">
          <svg id="sound-icon-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <svg id="sound-icon-off" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>

        <button class="nav-btn count-pill" onclick="toggleParticipantsDrawer()" title="View active members" aria-label="View active members">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span id="participant-count-badge">1</span>
        </button>
      </div>
    </header>

    <!-- Message Stream -->
    <div id="messages-stream" class="messages-stream">
      <!-- Injected messages -->
    </div>

    <!-- Drag & Drop Overlay -->
    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-zone">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Drop file to send to room</span>
      </div>
    </div>

    <!-- Message Composer -->
    <footer class="chat-footer">
      <form class="composer-form" onsubmit="handleSendMessage(event)">
        <button type="button" id="attach-button" class="btn-attach" onclick="triggerFileInput()" title="Attach file" aria-label="Attach file">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="file" id="file-input" class="hidden" onchange="handleFileSelected(event)">
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Message room or /w user msg..." 
          autocomplete="off" 
          maxlength="2000"
          onkeydown="handleInputKeydown(event)"
        />
        <button type="submit" id="send-button" class="btn-send" title="Send (Enter)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
    </footer>

    <!-- Participants Drawer -->
    <div id="drawer-backdrop" class="drawer-backdrop hidden" onclick="toggleParticipantsDrawer()"></div>
    <aside id="participants-drawer" class="participants-drawer hidden" aria-label="Participants">
      <div class="drawer-header">
        <h2>Active Members (<span id="drawer-user-count">0</span>)</h2>
        <button class="nav-btn compact" onclick="toggleParticipantsDrawer()" title="Close" aria-label="Close">✕</button>
      </div>
      <ul id="participants-list" class="member-list">
        <!-- Injected list -->
      </ul>
    </aside>
  </main>

  <!-- FILE EDITOR MODAL -->
  <div id="file-editor-modal" class="modal-overlay hidden" aria-hidden="true" role="dialog" aria-labelledby="editor-title" onclick="handleModalBackdropClick(event)">
    <div class="modal-card file-editor-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="modal-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </div>
          <div>
            <h2 id="editor-title" class="modal-title">Edit & Resend File</h2>
            <p class="modal-subtitle">Modify text content and broadcast back to room</p>
          </div>
        </div>
        <button type="button" class="nav-btn compact" onclick="closeFileEditor()" title="Close editor" aria-label="Close editor">✕</button>
      </div>

      <div class="modal-body file-editor-body">
        <div class="editor-filename-row">
          <label for="editor-filename">File Name</label>
          <input type="text" id="editor-filename" spellcheck="false" autocomplete="off" placeholder="demo.txt">
        </div>
        
        <div class="editor-textarea-wrap">
          <textarea id="file-editor-textarea" spellcheck="false" placeholder="File content..." oninput="updateEditorStats()" onkeydown="handleEditorKeydown(event)"></textarea>
        </div>

        <div class="editor-stats-bar">
          <span id="editor-stats-info">Lines: 0 · Chars: 0 · 0 B</span>
          <span class="editor-hint">Ctrl+Enter to send · Esc to close</span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-modal secondary" onclick="closeFileEditor()">Cancel</button>
        <div class="modal-footer-actions">
          <button type="button" class="btn-modal action-download" onclick="downloadEditedFile()" title="Download local copy">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>Save Copy</span>
          </button>
          <button type="button" class="btn-modal primary" onclick="saveAndResendFile()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            <span>Send to Room</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
